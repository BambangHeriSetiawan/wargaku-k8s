# Replace wargaku.id / api.wargaku.id with your actual domains
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wargaku-ingress
  namespace: wargaku
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  tls:
    - hosts:
        - wargaku.id
        - www.wargaku.id
      secretName: wargaku-web-tls
    - hosts:
        - api.wargaku.id
      secretName: wargaku-api-tls
    - hosts:
        - grafana.wargaku.id
      secretName: wargaku-grafana-tls
  rules:
    - host: wargaku.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wargaku-web
                port:
                  number: 80
    - host: www.wargaku.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wargaku-web
                port:
                  number: 80
    - host: api.wargaku.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wargaku-api
                port:
                  number: 80
    - host: grafana.wargaku.id
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
